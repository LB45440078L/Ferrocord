name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  # The Release workflow runs the full CI suite against the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  # `github.workflow` is the caller's name under workflow_call, so this never
  # collides with the Release workflow's own concurrency group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo bash packaging/linux/install-build-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ferrocord") | .rust_version')
          echo "Declared MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install Linux build dependencies
        run: sudo bash packaging/linux/install-build-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: sudo bash packaging/linux/install-build-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  lint-release-config:
    name: workflows + packaging lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint (with shellcheck)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck packaging scripts
        run: shellcheck --severity=style packaging/*/*.sh scripts/*.sh .github/scripts/*.sh
      - name: PSScriptAnalyzer (Windows scripts)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser
          $issues = Get-ChildItem packaging, scripts -Recurse -Filter *.ps1 |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings packaging/PSScriptAnalyzerSettings.psd1 }
          $issues | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
          if ($issues) { throw "PSScriptAnalyzer found $(@($issues).Count) issue(s)" }
      - name: Python packaging helpers compile
        run: python3 -m py_compile packaging/*/*.py
      - name: Validate desktop entry and AppStream metadata
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends desktop-file-utils appstream
          desktop-file-validate packaging/linux/dev.ferrocord.Ferrocord.desktop
          appstreamcli validate --no-net --explain packaging/linux/dev.ferrocord.Ferrocord.metainfo.xml
      - name: Check release-plz covers every workspace member
        run: python3 .github/scripts/check-release-config.py

  # Single required status check for branch protection.
  ci-ok:
    name: CI result
    if: always()
    needs: [fmt, test, msrv, docs, deny, lint-release-config]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "CI passed"
      - name: Some jobs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::One or more CI jobs failed: ${{ join(needs.*.result, ', ') }}"
          exit 1
