name: Release

# Builds, packages, smoke-tests and publishes a release. See docs/RELEASING.md.
#
# * Push of a tag vX.Y.Z or vX.Y.Z-pre -> full release (prerelease if the version has a "-").
# * workflow_dispatch                  -> dry run by default (everything except publishing).
#   Run it *from a tag* ("Use workflow from: Tags > vX.Y.Z") with dry-run unticked to
#   publish that tag; the Release PR workflow does this after release-plz pushes a tag.
# * Weekly schedule                    -> dry run of main, so packaging breakage shows up early.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build, package and smoke-test only; do not create a GitHub release."
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  PROFILE: dist

jobs:
  prepare:
    name: Verify version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine version and tag
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ferrocord") | .version')
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          [[ $version =~ $semver ]] || { echo "::error::workspace version '$version' is not SemVer"; exit 1; }

          tag=""
          if [[ $REF_TYPE == tag ]]; then tag=$REF_NAME; fi
          if [[ -n $tag && $tag != "v$version" ]]; then
            echo "::error::tag $tag does not match the workspace version $version (expected v$version)"
            exit 1
          fi

          publish=false
          if [[ -n $tag && ( $EVENT == push || ( $EVENT == workflow_dispatch && $INPUT_DRY_RUN == false ) ) ]]; then
            publish=true
          fi
          prerelease=false
          if [[ $version == *-* ]]; then prerelease=true; fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            echo "ref=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Ferrocord $version"
            echo "- tag: \`${tag:-none (dry run of $REF_NAME)}\`"
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- publish: **$publish**, prerelease: **$prerelease**"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Render release notes
        env:
          TAG: ${{ steps.meta.outputs.tag || format('v{0}', steps.meta.outputs.version) }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            bash .github/scripts/release-notes.sh "$TAG" release-notes.md
          else
            git cliff --unreleased --tag "$TAG" --strip header --output release-notes.md
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # Native Windows on Arm runner (free for public repositories). Fallback if it is
          # unavailable: cross-compile on windows-latest (MSVC ARM64 build tools are installed
          # there too) and drop the arm64 leg of smoke-windows.
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          # Oldest supported Ubuntu LTS runner: glibc 2.35 keeps the binaries working on older distros.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          # Cross-compiled on Apple Silicon (Intel runners are being retired); tested under Rosetta.
          - { target: x86_64-apple-darwin, os: macos-15 }
    env:
      FERROCORD_REQUIRE_WINRES: "1"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo bash packaging/linux/install-build-deps.sh --package
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Caches saved on tags are only visible to that tag; the weekly run on main warms them.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        shell: bash
        run: cargo build --locked --profile "$PROFILE" --target ${{ matrix.target }} -p ferrocord

      - name: Stage binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p bin
          case $TARGET in
            *windows*) cp "target/$TARGET/$PROFILE/ferrocord.exe" bin/ ;;
            *) cp "target/$TARGET/$PROFILE/ferrocord" bin/ ;;
          esac
          ls -l bin
      - name: Check --version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GUI-subsystem binary: capture stdout through a redirected pipe.
          $p = Start-Process bin/ferrocord.exe -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput version.txt
          $out = (Get-Content -Raw version.txt).Trim()
          if ($p.ExitCode -ne 0 -or $out -ne 'ferrocord ${{ needs.prepare.outputs.version }}') { throw "unexpected: '$out' (exit $($p.ExitCode))" }
          (Get-Item bin/ferrocord.exe).VersionInfo | Format-List ProductName, ProductVersion, FileVersionRaw
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: bin/
          if-no-files-found: error

      - name: Install cargo-deb and cargo-generate-rpm
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Package (tar.gz, deb, rpm, AppImage)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 packaging/linux/stamp-metainfo.py "$VERSION"
          bash packaging/linux/package.sh ${{ matrix.target }} "$VERSION" dist
          ls -l dist
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  package-windows:
    name: Package Windows ${{ matrix.arch }} (zip + MSI)
    needs: [prepare, build]
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      # WiX 5 is MS-RL licensed; WiX 6+ needs the OSMF EULA to be accepted, so stay on 5.x.
      WIX_VERSION: "5.0.2"
      # wix.dll targets .NET 6; let it run on the runner's newer .NET.
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: bin-${{ matrix.target }}
          path: bin
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add --global "WixToolset.UI.wixext/$env:WIX_VERSION" "WixToolset.Util.wixext/$env:WIX_VERSION"
          wix --version
      - name: Load code-signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Host 'No signing certificate configured: building unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          WINDOWS_SIGN_PFX: ${{ steps.cert.outputs.pfx }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          ./packaging/windows/package.ps1 -Exe bin/ferrocord.exe -Version $env:VERSION -Arch $env:ARCH -OutDir dist
          Get-ChildItem dist | Format-Table Name, Length
      - name: Remove certificate
        if: always() && steps.cert.outputs.pfx != ''
        shell: pwsh
        run: Remove-Item -Force '${{ steps.cert.outputs.pfx }}'
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  winget-manifests:
    name: Render winget manifests
    needs: [prepare, package-windows]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-windows-*
          path: dist
          merge-multiple: true
      - name: Render and validate
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          ./packaging/winget/render.ps1 -Version $env:VERSION -Repository $env:REPO -OutDir winget `
            -X64Msi "dist/ferrocord-$env:VERSION-windows-x86_64.msi" -Arm64Msi "dist/ferrocord-$env:VERSION-windows-arm64.msi"
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest "winget/$env:VERSION"
            # 0 = valid, 0x8A150028 (-1978335192 as Int32) = valid with warnings.
            if ($LASTEXITCODE -notin 0, -1978335192) { throw "winget validate failed ($LASTEXITCODE)" }
          } else {
            Write-Host 'winget is not available on this runner; skipping manifest validation.'
          }
      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: winget/
          if-no-files-found: error

  package-macos:
    name: Package macOS ${{ matrix.arch }} (.dmg)
    needs: [prepare, build]
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, target: aarch64-apple-darwin }
          - { arch: x86_64, target: x86_64-apple-darwin }
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      DMGBUILD_VERSION: "1.6.7"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: bin-${{ matrix.target }}
          path: bin
      - name: Install dmgbuild
        run: pipx install "dmgbuild==$DMGBUILD_VERSION"
      - name: Import Developer ID certificate
        id: sign
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          if [[ -z $P12_BASE64 ]]; then
            echo "No Developer ID certificate configured: ad-hoc signing, no notarization."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          # Search the new keychain first, keeping the existing ones.
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # one path per word
          security list-keychains -d user -s "$keychain" $existing
          rm "$RUNNER_TEMP/sign.p12"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          if [[ -n $NOTARY_KEY_BASE64 ]]; then
            echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "notary-key=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          MACOS_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          APPLE_NOTARY_KEY: ${{ steps.sign.outputs.notary-key }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          chmod +x bin/ferrocord
          bash packaging/macos/package.sh "$VERSION" "$ARCH" bin/ferrocord dist
          ls -l dist
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          if [[ -f $RUNNER_TEMP/signing.keychain-db ]]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  smoke-linux:
    name: Smoke ${{ matrix.case.kind }} on ${{ matrix.case.image }} (${{ matrix.arch }})
    needs: [prepare, build]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        case:
          - { kind: deb, image: "ubuntu:22.04" }
          - { kind: deb, image: "ubuntu:24.04" }
          - { kind: deb, image: "debian:12" }
          - { kind: rpm, image: "fedora:latest" }
          - { kind: rpm, image: "opensuse/tumbleweed" }
          - { kind: appimage, image: "ubuntu:22.04" }
          - { kind: appimage, image: "fedora:latest" }
          - { kind: tar, image: "ubuntu:24.04" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.arch }}-unknown-linux-gnu
          path: dist
      - name: Smoke test in ${{ matrix.case.image }}
        env:
          KIND: ${{ matrix.case.kind }}
          IMAGE: ${{ matrix.case.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          case $KIND in
            deb) artifact=$(ls dist/*.deb) ;;
            rpm) artifact=$(ls dist/*.rpm) ;;
            appimage) artifact=$(ls dist/*.AppImage) ;;
            tar) artifact=$(ls dist/*.tar.gz) ;;
          esac
          docker run --rm -v "$PWD:/w" -w /w "$IMAGE" bash packaging/linux/smoke-test.sh "$KIND" "$artifact" "$VERSION"

  smoke-windows:
    name: Smoke Windows ${{ matrix.arch }}
    needs: [prepare, package-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: windows-latest }
          - { arch: arm64, os: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist
      - name: Fetch the previous release's MSI (upgrade test)
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $tag = gh release view --json tagName --jq .tagName 2>$null
          if (-not $tag -or $tag -eq "v$env:VERSION") { Write-Host 'No earlier release to upgrade from.'; exit 0 }
          gh release download $tag --pattern "*-windows-$env:ARCH.msi" --dir previous 2>$null
          $msi = Get-ChildItem previous -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT } else { Write-Host "$tag has no $env:ARCH MSI." }
          exit 0
      - name: Smoke test zip and MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PREVIOUS_MSI: ${{ steps.previous.outputs.msi }}
        run: |
          $upgrade = @{}
          if ($env:PREVIOUS_MSI) { $upgrade.UpgradeFromMsi = $env:PREVIOUS_MSI }
          ./packaging/windows/smoke-test.ps1 -Version $env:VERSION @upgrade `
            -Zip "dist/ferrocord-$env:VERSION-windows-$env:ARCH.zip" `
            -Msi "dist/ferrocord-$env:VERSION-windows-$env:ARCH.msi"

  smoke-macos:
    name: Smoke macOS ${{ matrix.arch }}
    needs: [prepare, package-macos]
    # Apple Silicon runner; the x86_64 image is executed under Rosetta 2.
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist
      - name: Smoke test dmg
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash packaging/macos/smoke-test.sh "dist/ferrocord-$VERSION-macos-$ARCH.dmg" "$VERSION" "$ARCH"

  release:
    name: Publish GitHub release
    needs: [prepare, ci, build, package-windows, package-macos, winget-manifests, smoke-linux, smoke-windows, smoke-macos]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign build provenance (Sigstore)
      attestations: write # store build provenance
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * | tee ../SHA256SUMS
          mv ../SHA256SUMS .
      - name: Build provenance attestation
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create draft release with all assets
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Ferrocord ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          expected=$(find dist -type f | wc -l)
          uploaded=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.assets | length')
          if [[ $uploaded -ne $expected ]]; then
            echo "::error::release has $uploaded assets, expected $expected; leaving it as a draft"
            exit 1
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false >/dev/null
          echo "Published ${{ github.server_url }}/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  publish-winget:
    name: Submit to winget
    needs: [prepare, release]
    # Stable releases only; winget has no pre-release channel.
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: winget-manifests
          path: winget
      - name: Submit manifests with wingetcreate
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host '::notice::WINGET_TOKEN is not set; the rendered manifests are attached to this run as "winget-manifests".'
            exit 0
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: Ferrocord.Ferrocord version $env:VERSION" "winget/$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed ($LASTEXITCODE)" }

  publish-homebrew:
    name: Update Homebrew tap
    needs: [prepare, release]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    env:
      # Repository holding Casks/ferrocord.rb; override with the HOMEBREW_TAP variable.
      TAP: ${{ vars.HOMEBREW_TAP || format('{0}/homebrew-tap', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-macos-*
          path: dist
          merge-multiple: true
      - name: Render cask
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
          # package-macos notarizes whenever a Developer ID certificate and notary key are configured.
          NOTARIZED: ${{ secrets.MACOS_SIGN_P12_BASE64 != '' && secrets.APPLE_NOTARY_KEY_BASE64 != '' }}
        run: |
          notarized=()
          if [[ $NOTARIZED == true ]]; then notarized=(--notarized); fi
          python3 packaging/homebrew/render-cask.py --version "$VERSION" --repository "$REPO" "${notarized[@]}" \
            --arm64-dmg "dist/ferrocord-$VERSION-macos-arm64.dmg" \
            --x86_64-dmg "dist/ferrocord-$VERSION-macos-x86_64.dmg" \
            --output cask/Casks/ferrocord.rb
          cat cask/Casks/ferrocord.rb
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-cask
          path: cask/
      - name: Push to the tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ -z $TOKEN ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the rendered cask is attached to this run as \"homebrew-cask\"."
            exit 0
          fi
