[package]
name = "ferrocord"
description = "Ferrocord — a fast, open-source Discord client written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "ferrocord"

[[bin]]
name = "ferrocord"
path = "src/main.rs"

[dependencies]
ferrocord-core.workspace = true
# ferrocord-plugin.workspace = true
# ferrocord-api.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
chrono.workspace = true
anyhow.workspace = true
reqwest.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
qrcode = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
notify-rust = "4"
rfd = "0.17"
emojis = "0.8"
open = "5"
unicode-segmentation = "1"
wry = "0.57"
tao = "0.37"
sha2.workspace = true
base64.workspace = true
